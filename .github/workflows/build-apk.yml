name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Rasoi Mitra APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Accept Android SDK Licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Sync Web Assets to Android App
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html cook-manager.html manifest.json sw.js android/app/src/main/assets/
          cp -r assets android/app/src/main/assets/

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk RasoiMitra.apk
          ls -la RasoiMitra.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RasoiMitra-APK
          path: RasoiMitra.apk
          retention-days: 60

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "Rasoi Mitra Android APK v1.0.0"
          draft: false
          prerelease: false
          body: |
            ### 📱 Rasoi Mitra Android App (APK)

            Download and install the APK file directly on your Android phone:
            
            - **App:** Rasoi Mitra - Home Cook & Kitchen Manager
            - **File:** `RasoiMitra.apk`
            - **Package:** `com.rasoimitra.app`
            
            #### 📥 How to Install:
            1. Download **`RasoiMitra.apk`** below.
            2. Send it to your phone via WhatsApp (as a Document) or download directly on your phone.
            3. Tap on the file on your phone and click **Install**.
          files: RasoiMitra.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
